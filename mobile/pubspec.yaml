name: realtime_doctor_mobile
description: "Realtime Doctor mobile — capture + viewer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + DI (Riverpod codegen)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # HTTP (Dio — Retrofit 은 retrofit_generator/analyzer 호환 깨져서 제거)
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Supabase
  supabase_flutter: ^2.8.0

  # Models / freezed (immutable entities & DTOs)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI / sizing / i18n
  flutter_screenutil: ^5.9.3
  intl: any
  google_fonts: ^6.2.1

  # Icons
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8

  # Audio (capture + playback)
  record: ^5.2.0
  just_audio: ^0.9.42
  permission_handler: ^11.3.1
  audio_session: ^0.1.21

  # WebSocket (CLOVA Streaming / OpenAI Realtime)
  web_socket_channel: ^3.0.1

  # Storage / cache
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5

  # Env
  flutter_dotenv: ^5.2.1

  # Utils
  logger: ^2.5.0
  equatable: ^2.0.5
  collection: ^1.18.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # codegen
  build_runner: ^2.5.0
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.8.0

dependency_overrides:
  # analyzer 7.x 와 호환되는 plugin 으로 강제. 0.13+ 가 Element2 API 사용.
  analyzer_plugin: ">=0.13.0 <0.14.0"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
