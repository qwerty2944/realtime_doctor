name: Build Windows Installer

# Private mirror only. Manual trigger; artifact download only, no GitHub Release.
# API keys are baked into the binary at build time, which is why this workflow
# must never exist in the public repository.
on:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Bake API keys into the build. electron.vite.config.ts loads .env and
      # inlines EMBEDDED_ENV_KEYS via `define` at build time.
      # This step fails loudly when a required key is missing, rather than
      # producing a silently broken installer.
      - name: Write .env from repository secrets
        shell: pwsh
        env:
          # [HARD] GEMINI_API_KEY and OPENAI_API_KEY are deliberately absent.
          # A1 moved them to Edge Function secrets (`ai-gemini`, `ai-realtime`).
          # Do not re-add them here: anything written into .env is inlined into
          # out/main/index.js by electron.vite.config.ts, and the build then
          # ships a spendable key again. scripts/ci-assert-embedded.mjs fails
          # the build if either key reappears in the bundle.
          GEMINI_TRANSCRIBE_MODEL: ${{ secrets.GEMINI_TRANSCRIBE_MODEL }}
          GEMINI_DIARIZER_MODEL: ${{ secrets.GEMINI_DIARIZER_MODEL }}
          GEMINI_ANALYZER_MODEL: ${{ secrets.GEMINI_ANALYZER_MODEL }}
          GEMINI_SUMMARIZER_MODEL: ${{ secrets.GEMINI_SUMMARIZER_MODEL }}
          GEMINI_DICTATOR_MODEL: ${{ secrets.GEMINI_DICTATOR_MODEL }}
          # [S6-1] CLOVA_* removed: no longer baked into the bundle (client-direct
          # gRPC has no server backstop). Provisioned at runtime via
          # ~/.realtime-doctor.env. ci-assert-embedded.mjs fails the build if a
          # CLOVA value reappears in out/main/index.js.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ENTITLEMENT_PUBLIC_KEY: ${{ secrets.ENTITLEMENT_PUBLIC_KEY }}
          ENTITLEMENT_URL: ${{ secrets.ENTITLEMENT_URL }}
          BILLING_PORTAL_URL: ${{ secrets.BILLING_PORTAL_URL }}
          # Optional: src/main derives both from SUPABASE_URL when unset.
          DEVICE_FUNCTION_URL: ${{ secrets.DEVICE_FUNCTION_URL }}
          AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
        run: |
          # Must stay in sync with EMBEDDED_ENV_KEYS in electron.vite.config.ts
          # and REQUIRED_KEYS in scripts/ci-assert-embedded.mjs.
          $required = @(
            'GEMINI_TRANSCRIBE_MODEL','GEMINI_DIARIZER_MODEL',
            'GEMINI_ANALYZER_MODEL','GEMINI_SUMMARIZER_MODEL','GEMINI_DICTATOR_MODEL',
            'SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY',
            'ENTITLEMENT_PUBLIC_KEY','ENTITLEMENT_URL','BILLING_PORTAL_URL'
          )
          $optional = @('DEVICE_FUNCTION_URL','AI_PROXY_URL')

          $lines = @()
          $missing = @()
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { $missing += $name }
            else { $lines += "$name=$value" }
          }
          if ($missing.Count -gt 0) {
            throw "Missing required repository secret(s): $($missing -join ', '). Set them before building."
          }
          foreach ($name in $optional) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not [string]::IsNullOrWhiteSpace($value)) { $lines += "$name=$value" }
            else { Write-Host "Optional secret $name not set; derived at runtime." }
          }
          Set-Content -Path .env -Value $lines -Encoding utf8
          Write-Host "Wrote .env with $($lines.Count) key(s); all $($required.Count) required keys present."

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main bundles
        run: npm run build

      # The NSIS installer is LZMA-compressed, so grepping the .exe proves
      # nothing. Assert here, on the built bundle, before packaging.
      - name: Assert embedded configuration
        run: node scripts/ci-assert-embedded.mjs

      # `--publish never`: electron-builder otherwise auto-publishes on CI and
      # fails with "GitHub Personal Access Token is not set". We want artifacts only.
      - name: Package Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          # Do not attempt to discover / use a code-signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: realtime-doctor-win-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
